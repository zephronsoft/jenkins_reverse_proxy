# This file will be templated by the entrypoint script
# Environment variables: DOMAIN, JENKINS_HOST, JENKINS_PORT, SSL_ENABLED

# Upstream for Jenkins
upstream jenkins_backend {
    server ${JENKINS_HOST}:${JENKINS_PORT};
    keepalive 32;
}

# HTTP server - redirects to HTTPS when SSL is enabled
server {
    listen 80;
    server_name ${DOMAIN};
    
    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Health check endpoint (available on HTTP)
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    #__REDIRECT_BLOCK__
    #__PROXY_BLOCK__
}

# HTTPS server (only when SSL is enabled)
server {
    listen 443 ssl http2;
    server_name ${DOMAIN};
    
    # SSL Configuration
    ssl_certificate ${SSL_CERT_PATH};
    ssl_certificate_key ${SSL_KEY_PATH};
    
    # HSTS header
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    
    # Jenkins specific settings
    location / {
        proxy_pass http://jenkins_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Jenkins requires these headers for proper operation
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Server $host;
        
        # WebSocket support for Jenkins
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Increase proxy timeouts for Jenkins operations
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
        
        # Allow large file uploads
        client_max_body_size 100M;
        client_body_buffer_size 128k;
        
        # Disable proxy cache for Jenkins
        proxy_cache_bypass $http_upgrade;
        proxy_no_cache $http_upgrade;
        
        # Rate limiting
        limit_req zone=jenkins burst=20 nodelay;
    }
    
    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # Block access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Logging
    access_log /var/log/nginx/jenkins-access.log main;
    error_log /var/log/nginx/jenkins-error.log;
} 